<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>



body{margin:0}
.sec{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;height:44px}
.sec-c,.sec-x{background:#575757;border-radius:30px;height:44px;display:flex;align-items:center;gap:10px;padding:0 7px;box-sizing:border-box;border:1px solid rgba(255,255,255,.12);box-shadow:0 3px 12px rgba(0,0,0,.08),inset 0 1px 1.5px rgba(255,255,255,.12)}
.sec-c{transition:opacity .2s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1)}
.sec-x{position:absolute;left:50%;bottom:0;gap:8px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(10px) scale(.85);filter:blur(4px);transition:opacity .25s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1),filter .35s cubic-bezier(.4,0,.2,1),visibility 0s .45s}
.sec:hover .sec-x,.sec:focus-within .sec-x{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1);filter:none;transition-delay:0s}
.sec:hover .sec-c,.sec:focus-within .sec-c{opacity:0;transform:scale(.9)}
.sec-x a>span,.sec-x>span>span,.sec-c a>span,.sec-c>span>span{transition:transform .15s cubic-bezier(.4,0,.2,1),background-color .15s cubic-bezier(.4,0,.2,1)}
.sec-x a:hover>span,.sec-x>span:hover>span{background:#fff!important;transform:scale(1.08)}
.sec-x a:active>span,.sec-x>span:active>span{transform:scale(.95)}
.sec-x a:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:50%}
.sb{position:absolute;left:50%;top:20px;width:320px;transform:translateX(-50%);transition:width .5s cubic-bezier(.4,0,.2,1),background-color .15s cubic-bezier(.4,0,.2,1),transform .15s cubic-bezier(.4,0,.2,1),box-shadow .15s cubic-bezier(.4,0,.2,1);border:1px solid rgba(255,255,255,.12);box-shadow:0 3px 12px rgba(0,0,0,.08),inset 0 1px 1.5px rgba(255,255,255,.12)}
.sb:hover,.sb:focus-visible{width:380px;background:#626262!important}
.sb:active{transform:translateX(-50%) scale(.98)}
.sb:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sb svg{transition:transform .5s cubic-bezier(.4,0,.2,1)}.sb:hover svg{transform:scale(1.12)}
.shm{white-space:nowrap;color:transparent;-webkit-text-fill-color:transparent;background-image:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%),linear-gradient(#c9c9c9,#c9c9c9);background-size:250% 100%,auto;background-clip:text;-webkit-background-clip:text;animation:shm 2.2s linear infinite}
@keyframes shm{0%{background-position:100% center,0 0}100%{background-position:0% center,0 0}}
@keyframes enter{0%{opacity:0;filter:blur(2px)}100%{opacity:1;filter:blur(0)}}
@keyframes scale-in{0%{opacity:0;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes slide-in{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.sec-c,.sec-x,.sb,.shm,.sec-x a>span{transition-duration:.01ms!important;animation:none!important}}
.chip{transition:transform .15s cubic-bezier(.4,0,.2,1),background-color .15s cubic-bezier(.4,0,.2,1)}.chip:hover{background:#fff!important;transform:scale(1.04)}.chip:active{transform:scale(.95)}
.vt{transition:transform .7s cubic-bezier(.4,0,.2,1)}.vt:hover{transform:scale(1.04)}
@media (prefers-reduced-motion:reduce){.chip,.vt{animation:none!important}}
@keyframes scale-out{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.95)}}@keyframes slide-out{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(24px)}}@keyframes fade-out{0%{opacity:1}100%{opacity:0}}@keyframes enter-out{0%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(2px)}}
.bz.out .panel{animation:scale-out .35s cubic-bezier(.4,0,.2,1) .06s both}.bz.out .pin{animation:enter-out .3s cubic-bezier(.4,0,.2,1) both}.bz.out .chip,.bz.out .vt{animation:slide-out .3s cubic-bezier(.4,0,.2,1) both}.bz.out .velo{animation:fade-out .4s cubic-bezier(.4,0,.2,1) both}
@media (prefers-reduced-motion:reduce){.bz.out .panel,.bz.out .pin,.bz.out .chip,.bz.out .vt,.bz.out .velo{animation-duration:.01ms!important}}
.x{transition:transform .15s cubic-bezier(.4,0,.2,1),background-color .15s cubic-bezier(.4,0,.2,1)}.x:hover{background:#fff!important;transform:scale(1.08)}.x:active{transform:scale(.95)}
.x:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</helmet>
<div class="bz {{cls}}" style="position:relative;width:1440px;height:900px;background:#d9d9d9;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#fff">
  <div style="position:absolute;left:173px;top:100px;width:1086px;height:700px;background:#939393;border-radius:10px;"></div><div style="position:absolute;left:190px;top:116px;width:547px;height:668px;background:#afafaf;border-radius:6px;"></div><div style="position:absolute;left:743px;top:116px;width:5px;height:668px;background:#838383;border-radius:0px;"></div><div style="position:absolute;left:754px;top:116px;width:490px;height:668px;background:#afafaf;border-radius:6px;"></div>
  <button class="velo" onClick="{{close}}" aria-label="Cerrar buscador" style="position:absolute;inset:0;width:100%;height:100%;background:rgba(217,217,217,.55);display:block;cursor:default;border:0;padding:0"></button>
  <a ref="{{backRef}}" href="Anotador.dc.html" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0"></a>
  <div class="panel" style="position:absolute;left:490px;top:20px;width:460px;transform-origin:top center;animation:scale-in .4s cubic-bezier(.4,0,.2,1) both;z-index:5">
    <div style="height:40px;background:#575757;border-radius:30px;display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;box-sizing:border-box;font-size:14px;border:1px solid rgba(255,255,255,.12);box-shadow:0 3px 12px rgba(0,0,0,.08),inset 0 1px 1.5px rgba(255,255,255,.12)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <span style="flex:1;color:#ececec">Buscar en notas…</span>
      <button class="x" onClick="{{close}}" aria-label="Cerrar buscador" style="width:28px;height:28px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;border:0;padding:0;cursor:pointer"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
    </div>
    <div class="pin" style="margin-top:6px;background:#575757;border-radius:14px;padding:14px;box-sizing:border-box;border:1px solid rgba(255,255,255,.12);box-shadow:0 3px 12px rgba(0,0,0,.08);animation:enter .5s cubic-bezier(.4,0,.2,1) .08s both">
      <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:10px"><span>Recientes</span><span style="text-decoration:underline">Borrar</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px"><span class="chip" style="background:#d9d9d9;color:#111;border-radius:6px;padding:5px 12px;font-size:12px;animation:slide-in .5s cubic-bezier(.4,0,.2,1) 0.15s both">ideas</span><span class="chip" style="background:#d9d9d9;color:#111;border-radius:6px;padding:5px 12px;font-size:12px;animation:slide-in .5s cubic-bezier(.4,0,.2,1) 0.19s both">libro western</span><span class="chip" style="background:#d9d9d9;color:#111;border-radius:6px;padding:5px 12px;font-size:12px;animation:slide-in .5s cubic-bezier(.4,0,.2,1) 0.23s both">captura</span><span class="chip" style="background:#d9d9d9;color:#111;border-radius:6px;padding:5px 12px;font-size:12px;animation:slide-in .5s cubic-bezier(.4,0,.2,1) 0.27s both">dibujo</span></div>
      <div style="font-size:11px;font-weight:600;margin:16px 0 10px">Páginas recientes</div>
      <div style="display:flex;gap:8px;overflow:hidden;margin-right:-14px"><div class="vt" style="flex:none;width:80px;height:72px;background:#d9d9d9;border-radius:6px;animation:slide-in .6s cubic-bezier(.4,0,.2,1) 0.30s both"></div><div class="vt" style="flex:none;width:80px;height:72px;background:#d9d9d9;border-radius:6px;animation:slide-in .6s cubic-bezier(.4,0,.2,1) 0.35s both"></div><div class="vt" style="flex:none;width:80px;height:72px;background:#d9d9d9;border-radius:6px;animation:slide-in .6s cubic-bezier(.4,0,.2,1) 0.40s both"></div><div class="vt" style="flex:none;width:80px;height:72px;background:#d9d9d9;border-radius:6px;animation:slide-in .6s cubic-bezier(.4,0,.2,1) 0.45s both"></div><div class="vt" style="flex:none;width:80px;height:72px;background:#d9d9d9;border-radius:6px;animation:slide-in .6s cubic-bezier(.4,0,.2,1) 0.50s both"></div></div>
    </div>
  </div>
  <!-- Botón de sección: colapsado, se extiende al hover -->
  <div class="sec"><div class="sec-c"><span aria-label="Sección actual" style="display:flex"><span title="Sección actual" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l1-3.5L11 2.5l2.5 2.5L6.5 12z"/></svg></span></span><span style="width:5px;height:24px;border-left:1px solid #d9d9d9;border-right:1px solid #d9d9d9;box-sizing:border-box;flex:none;opacity:.8"></span><span aria-label="Herramienta actual" style="display:flex"><span title="Herramienta actual" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13c2 0 3-1 3-2.5L12 3l1 1-6.5 6C6 12 5 13 3 13z"/></svg></span></span></div><div class="sec-x"><span aria-label="Texto" style="display:flex"><span title="Texto" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4V3h10v1M8 3v10M6 13h4"/></svg></span></span><span aria-label="Formato" style="display:flex"><span title="Formato" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a2 2 0 010 4H5zM5 7h5a2 2 0 010 4H5z"/></svg></span></span><span aria-label="Dibujar" style="display:flex"><span title="Dibujar" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13c2 0 3-1 3-2.5L12 3l1 1-6.5 6C6 12 5 13 3 13z"/></svg></span></span><span aria-label="Borrador" style="display:flex"><span title="Borrador" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-6 5 4-4 5H5z M7 13h7"/></svg></span></span><span aria-label="Captura de pantalla" style="display:flex"><span title="Captura de pantalla" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5V3h3M11 3h3v2M14 11v2h-3M5 13H2v-2"/><rect x="5" y="6" width="6" height="4" rx=".8"/></svg></span></span><span aria-label="Libros" style="display:flex"><span title="Libros" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h5v10H2zM9 3h5v10H9z"/></svg></span></span><span style="width:5px;height:24px;border-left:1px solid #d9d9d9;border-right:1px solid #d9d9d9;box-sizing:border-box;flex:none;opacity:.8"></span><a href="Main.dc.html" aria-label="Principal" style="display:flex"><span title="Principal" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="12" height="5" rx="1"/></svg></span></a><a href="Archivo.dc.html" aria-label="Archivo" style="display:flex"><span title="Archivo" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4.5" rx="1.2"/><rect x="2" y="9" width="12" height="4.5" rx="1.2"/></svg></span></a><span style="width:5px;height:24px;border-left:1px solid #d9d9d9;border-right:1px solid #d9d9d9;box-sizing:border-box;flex:none;opacity:.8"></span><span aria-label="Reglas y ajustes" style="display:flex"><span title="Reglas y ajustes" style="width:30px;height:30px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg></span></span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { out: false }; this.backEl = null; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    return {
      cls: this.state.out ? 'out' : '',
      backRef: (el) => { this.backEl = el; },
      close: () => {
        if (this.state.out) return;
        this.setState({ out: true });
        this.t = setTimeout(() => {
          if (this.backEl) this.backEl.click();
          setTimeout(() => this.setState({ out: false }), 80);
        }, 420);
      }
    };
  }
}
</script>
