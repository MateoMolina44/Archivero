<style>
.sec{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;height:44px}
.sec-c,.sec-x{background:#575757;border-radius:30px;height:44px;display:flex;align-items:center;gap:10px;padding:0 7px;box-sizing:border-box;border:1px solid rgba(255,255,255,.12);box-shadow:0 3px 12px rgba(0,0,0,.08),inset 0 1px 1.5px rgba(255,255,255,.12)}
.sec-c{transition:opacity .2s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1)}
.sec-x{position:absolute;left:50%;bottom:0;gap:8px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(10px) scale(.85);filter:blur(4px);transition:opacity .25s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1),filter .35s cubic-bezier(.4,0,.2,1),visibility 0s .45s}
.sec:hover .sec-x,.sec:focus-within .sec-x{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1);filter:none;transition-delay:0s}
.sec:hover .sec-c,.sec:focus-within .sec-c{opacity:0;transform:scale(.9)}
.sec-x a>span,.sec-x>span>span,.sec-c a>span,.sec-c>span>span{transition:transform .15s cubic-bezier(.4,0,.2,1),background-color .15s cubic-bezier(.4,0,.2,1)}
.sec-x a:hover>span,.sec-x>span:hover>span{background:#fff!important;transform:scale(1.08)}
.sec-x a:active>span,.sec-x>span:active>span{transform:scale(.95)}
.sec-x a:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:50%}
.sb{position:absolute;left:50%;top:20px;width:320px;transform:translateX(-50%);transition:width .5s cubic-bezier(.4,0,.2,1),background-color .15s cubic-bezier(.4,0,.2,1),transform .15s cubic-bezier(.4,0,.2,1),box-shadow .15s cubic-bezier(.4,0,.2,1);border:1px solid rgba(255,255,255,.12);box-shadow:0 3px 12px rgba(0,0,0,.08),inset 0 1px 1.5px rgba(255,255,255,.12)}
.sb:hover,.sb:focus-visible{width:380px;background:#626262!important}
.sb:active{transform:translateX(-50%) scale(.98)}
.sb:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sb svg{transition:transform .5s cubic-bezier(.4,0,.2,1)}.sb:hover svg{transform:scale(1.12)}
.shm{white-space:nowrap;color:transparent;-webkit-text-fill-color:transparent;background-image:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%),linear-gradient(#c9c9c9,#c9c9c9);background-size:250% 100%,auto;background-clip:text;-webkit-background-clip:text;animation:shm 2.2s linear infinite}
@keyframes shm{0%{background-position:100% center,0 0}100%{background-position:0% center,0 0}}
@keyframes enter{0%{opacity:0;filter:blur(2px)}100%{opacity:1;filter:blur(0)}}
@keyframes scale-in{0%{opacity:0;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes slide-in{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.sec-c,.sec-x,.sb,.shm,.sec-x a>span{transition-duration:.01ms!important;animation:none!important}}
body{margin:0}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.pc{position:absolute;inset:0;overflow:hidden;transition:transform 1.2s cubic-bezier(.19,1,.22,1)}
.img{position:absolute;left:0;top:-180px;width:100%;height:1260px;transition:transform 1.2s cubic-bezier(.19,1,.22,1)}
.dark{position:absolute;inset:0;background:#000;transition:opacity .9s cubic-bezier(.19,1,.22,1)}
.closer{position:absolute;inset:0;width:100%;height:100%}
.tl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform 1.2s cubic-bezier(.19,1,.22,1)}
.tbtn{pointer-events:auto;position:relative;display:block;text-align:center}
.tt{position:relative;display:block;text-align:center;font-size:64px;line-height:1.1;letter-spacing:-1px;font-weight:600;color:#fff}
.ty{position:absolute;left:0;top:0;white-space:nowrap}
.ul{display:inline-block;position:relative}
.ul::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:currentColor;transform:scaleX(0);transform-origin:right center;transition:transform .7s cubic-bezier(.19,1,.22,1)}
.tbtn:hover .ul::after{transform:scaleX(1);transform-origin:left center}
.tg{position:absolute;left:0;right:0;top:100%;margin-top:22px;font-size:14px;letter-spacing:0;font-weight:400;opacity:0;transition:opacity .4s linear}
.tbtn:hover .tg,.tbtn:focus-visible .tg{opacity:1}
.info{position:absolute;left:50%;top:215px;width:700px;margin-left:-350px;color:#fff;font-weight:700;font-size:16px;line-height:1.5;pointer-events:none}
.info p{margin:0 0 14px;min-height:1.5em}
.cur{display:inline-block;width:.5em;height:.85em;background:currentColor;vertical-align:-.08em;margin-left:2px}
.nv{font-size:14px;color:#fff;position:relative;display:inline-block}
.nv::after{content:"";position:absolute;left:0;bottom:-2px;width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right center;transition:transform .7s cubic-bezier(.19,1,.22,1)}
.nv:hover::after,.nv:focus-visible::after{transform:scaleX(1);transform-origin:left center}
.nv:focus-visible,.tbtn:focus-visible{outline:2px solid #fff;outline-offset:6px}
@media (prefers-reduced-motion:reduce){.pc,.img,.tl,.dark,.ul::after,.tg{transition-duration:.01s!important}}
@keyframes bar-in{0%{left:560px;width:320px}100%{left:490px;width:460px}}
@keyframes bar-out{0%{left:490px;width:460px}100%{left:560px;width:320px}}
@keyframes drop-in{0%{opacity:0;clip-path:inset(0 0 100% 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes drop-out{0%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 100% 0)}}
@keyframes slide-out{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(24px)}}
@keyframes fade-out{0%{opacity:1}100%{opacity:0}}
.bz .velo{animation:enter .35s cubic-bezier(.4,0,.2,1) both}
.bz .panel{animation:bar-in .5s cubic-bezier(.4,0,.2,1) both}
.bz .pin{animation:drop-in .5s cubic-bezier(.4,0,.2,1) .12s both}
.bz .chip,.bz .vt{animation:slide-in .5s cubic-bezier(.4,0,.2,1) both;animation-delay:var(--d)}
.bz.out .panel{animation:bar-out .45s cubic-bezier(.4,0,.2,1) .15s both!important}.bz.out .pin{animation:drop-out .3s cubic-bezier(.4,0,.2,1) both!important}.bz.out .chip,.bz.out .vt{animation:slide-out .3s cubic-bezier(.4,0,.2,1) both!important}.bz.out .velo{animation:fade-out .45s cubic-bezier(.4,0,.2,1) .1s both!important}
.chip{transition:transform .15s cubic-bezier(.4,0,.2,1),background-color .15s cubic-bezier(.4,0,.2,1)}.chip:hover{background:#fff!important;transform:scale(1.04)}.chip:active{transform:scale(.95)}
.vt{transition:transform .7s cubic-bezier(.4,0,.2,1)}.vt:hover{transform:scale(1.04)}
.x{transition:transform .15s cubic-bezier(.4,0,.2,1),background-color .15s cubic-bezier(.4,0,.2,1)}.x:hover{background:#fff!important;transform:scale(1.08)}.x:active{transform:scale(.95)}
.x:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fv{font-size:14px;position:relative;display:inline-block;color:#fff;text-decoration:none}
.fv::after{content:"";position:absolute;left:0;bottom:-2px;width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right center;transition:transform .7s cubic-bezier(.19,1,.22,1)}
.fv:hover::after{transform:scaleX(1);transform-origin:left center}
@media (prefers-reduced-motion:reduce){.bz .velo,.bz .panel,.bz .pin,.bz .chip,.bz .vt,.bz.out .panel,.bz.out .pin,.bz.out .chip,.bz.out .vt,.bz.out .velo{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>

 stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg></span></span></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { index: 0, entered: false, n: 0, open: false, m: 0, tn: 0, sq: 'off' };
    this.lockUntil = 0;
    this.iv = null; this.iv2 = null; this.t1 = null; this.t2 = null;
  }
  componentDidMount() {
    this.t1 = setTimeout(() => { this.setState({ entered: true }); this.typeTitle(); }, 150);
    this.tiv = setInterval(() => { const tn = this.state.tn + 1; this.setState({ tn }); if (tn >= 40) clearInterval(this.tiv); }, 40);
  }
  componentWillUnmount() { clearInterval(this.iv); clearInterval(this.iv2); clearTimeout(this.t1); clearTimeout(this.t2); clearInterval(this.tiv); clearTimeout(this.t3); }
  names() { return ['Nombre uno', 'Nombre dos', 'Nombre tres', 'Nombre cuatro', 'Nombre cinco']; }
  infoLines(i) {
    return ['Info: Lorem ipsum dolor sit amet, consectetur adipiscing elit.',
      'Descripción: Maecenas laoreet placerat tellus, in dictum mauris egestas sed. Sed ac consectetur ipsum.',
      'Dónde: Proin mollis lectus ac eros aliquet vulputate.',
      'Sitio Web: www.sitiowebimportante.com',
      'Fecha: 22/10/26, 20:15hs',
      'Tablero: Tablero #' + ((i || 0) % 4 + 1),
      'Etiquetas: #Etiqueta1 #Etiqueta2 #Etiqueta3 #Etiqueta4'];
  }
  typeTitle() {
    clearInterval(this.iv);
    this.setState({ n: 0 });
    clearTimeout(this.t2);
    this.t2 = setTimeout(() => {
      const len = this.names()[this.state.index].length;
      this.iv = setInterval(() => {
        const n = this.state.n + 1;
        this.setState({ n });
        if (n >= len) clearInterval(this.iv);
      }, 60);
    }, 350);
  }
  go(delta) {
    if (this.state.open) return;
    const now = Date.now();
    if (now < this.lockUntil) return;
    const next = Math.max(0, Math.min(4, this.state.index + delta));
    if (next === this.state.index) return;
    this.lockUntil = now + 1100;
    this.setState({ index: next, n: 0 });
    this.typeTitle();
  }
  toggle() {
    if (!this.state.entered) return;
    if (!this.state.open) {
      clearInterval(this.iv2);
      this.setState({ open: true, m: 0 });
      const total = this.infoLines(this.state.index).join('').length;
      this.t1 = setTimeout(() => {
        this.iv2 = setInterval(() => {
          const m = this.state.m + 4;
          this.setState({ m });
          if (m >= total) clearInterval(this.iv2);
        }, 30);
      }, 500);
    } else {
      clearInterval(this.iv2);
      clearTimeout(this.t1);
      this.setState({ open: false });
      this.t1 = setTimeout(() => this.setState({ m: 0 }), 1200);
    }
  }
  renderVals() {
    const { index, entered, n, open, m, tn } = this.state;
    const ty = (full, off) => { const c = Math.max(0, tn - off); return { t: full.slice(0, c), c: tn >= off && c < full.length }; };
    const s = ty('Buscar…', 2);
    const EX = 'cubic-bezier(.19,1,.22,1)';
    const names = this.names();
    const tones = ['#afafaf', '#a7a7a7', '#b7b7b7', '#a3a3a3', '#b0b0b0'];
    const pieces = names.map((name, i) => {
      const d = i - index;
      const lines = this.infoLines(i);
      const act = d === 0;
      const o = act && open;
      const typing = act && entered && n < name.length;
      const typed = act ? (entered ? name.slice(0, n) : '') : name;
      let left = act ? m : 0;
      const totalChars = lines.join('').length;
      let curDone = false;
      const ls = lines.map((t) => {
        const part = t.slice(0, Math.max(0, left));
        const here = act && open && m < totalChars && !curDone && part.length < t.length;
        if (here) curDone = true;
        left -= t.length;
        return { t: part, c: here };
      });
      return {
        name, typed, cur: typing,
        tab: act ? '0' : '-1', expanded: o ? 'true' : 'false',
        boxStyle: 'background:' + tones[i] + ';transform:translate3d(0,' + (d * 100) + '%,0);z-index:' + (act ? 2 : 1),
        imgStyle: 'transform:translate3d(0,' + (-d * 180 + (o ? -90 : 0)) + 'px,0)',
        darkStyle: 'opacity:' + (o ? 0.62 : 0),
        closerStyle: 'pointer-events:' + (o ? 'auto' : 'none') + ';cursor:' + (o ? 'pointer' : 'default'),
        titleStyle: 'transform:translate3d(0,' + (-d * 135 + (o ? -300 : 0)) + 'px,0)',
        infoStyle: 'opacity:' + (o ? 1 : 0) + ';transform:translate3d(0,' + (o ? 0 : 640) + 'px,0);transition:transform 1.1s ' + EX + ',opacity ' + (o ? '.7s ' + EX + ' .15s' : '.35s linear'),
        linkPE: o ? 'auto' : 'none',
        lines: ls
      };
    });
    return {
      pieces,
      counter: '0' + (index + 1) + ' / 05',
      wheel: (e) => { if (Math.abs(e.deltaY) > 8) this.go(e.deltaY > 0 ? 1 : -1); },
      prev: () => this.go(-1),
      next: () => this.go(1),
      toggle: () => this.toggle(),
      s, sOn: this.state.sq !== 'off', sCls: this.state.sq === 'out' ? 'bz out' : 'bz',
      openS: () => { clearTimeout(this.t3); this.setState({ sq: 'in' }); },
      closeS: () => { if (this.state.sq !== 'in') return; this.setState({ sq: 'out' }); this.t3 = setTimeout(() => this.setState({ sq: 'off' }), 640); }
    };
  }
}
</script>
